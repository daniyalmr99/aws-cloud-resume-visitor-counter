<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cloud Resume - Serverless Visitor Counter</title>
</head>
<body>
    <h1>Welcome to My AWS Cloud Resume</h1>
    <p>Page Views: <span id="visitor-count">Loading...</span></p>

    <script>
        const apiEndpoint = 'https://yziukpq581.execute-api.us-east-1.amazonaws.com';

        fetch(apiEndpoint)
            .then(response => response.json())
            .then(data => {
                document.getElementById('visitor-count').innerText = data.views;
            })
            .catch(error => {
                console.error('Error fetching visitor count:', error);
                document.getElementById('visitor-count').innerText = 'Error loading count';
            });
    </script>
</body>
</html>
